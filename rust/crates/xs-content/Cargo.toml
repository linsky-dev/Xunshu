[package]
name = "xs-content"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xs-content-worker"
path = "src/bin/worker.rs"

[dependencies]
anyhow = "1"
calamine = { version = "=0.38.0", default-features = false }
encoding_rs = "0.8"
fs2 = "0.4"
image = { version = "0.25", default-features = false }
lopdf = { version = "=0.42.0", default-features = false }
quick-xml = "0.41"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint", "hooks", "serialize"] }
scraper = { version = "=0.24.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1"
xs-platform = { path = "../xs-platform" }
xs-inference = { path = "../xs-inference" }
xs-runtime = { path = "../xs-runtime" }
zip = { version = "=9.0.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
