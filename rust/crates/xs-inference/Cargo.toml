[package]
name = "xs-inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xs-model-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "xs-install"
path = "src/bin/install.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "api-24"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
xs-platform = { path = "../xs-platform" }
xs-runtime = { path = "../xs-runtime" }
