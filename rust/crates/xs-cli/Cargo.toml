[package]
name = "xs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xunshu"
path = "src/main.rs"

[dependencies]
xs-core = { path = "../xs-core" }
xs-platform = { path = "../xs-platform" }
xs-query = { path = "../xs-query" }
xs-runtime = { path = "../xs-runtime" }
xs-content = { path = "../xs-content" }
xs-inference = { path = "../xs-inference" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
