[package]
name = "xs-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
fuzzing = []

[dependencies]
xs-query = { path = "../xs-query" }
xs-platform = { path = "../xs-platform" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1.4"
memmap2 = "0.9"
fs2 = "0.4"
csv = "1.3"
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
