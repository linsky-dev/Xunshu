[package]
name = "xs-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xs-core = { path = "../xs-core" }
xs-query = { path = "../xs-query" }
xs-platform = { path = "../xs-platform" }
xs-runtime = { path = "../xs-runtime" }
xs-content = { path = "../xs-content" }
xs-inference = { path = "../xs-inference" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
fs2 = "0.4"
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
tempfile = "3"
